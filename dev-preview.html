<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据帧回放工具 · 界面预览</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      界面预览入口。

      在普通浏览器里跑真实前端代码，用桩件顶替 Tauri IPC，
      这样调界面不用每次重编 Rust，也能在没有桌面截图权限的环境里检查渲染。
      只有这个 HTML 装桩件，src/ 下的应用代码一行都不为测试改动。
    -->
    <script type="module">
      const SAMPLE = [
        { p: "[TX] 000123 发送 ", d: "01 A5 3F 2B 90 11 4C 1A", t: "" },
        { p: "[RX] 000124 接收 ", d: "01 A5 40 2B 90 11 4C 1B", t: "" },
        { p: "[TX] 000125 发送 ", d: "02 B7 3F 2B", t: "  # 心跳" },
        { p: "[TX] 000126 发送 ", d: "01 A5 3F 2B 90 11 4C 1D", t: "" },
        { p: "[RX] 000127 接收 ", d: "0C 42 88 91 A0 07", t: "" },
      ];
      const ERRORS = {
        11: ["oddHexDigits", "十六进制字符数为奇数"],
        21: ["emptyData", "剥离前缀后没有十六进制数据"],
        41: ["notEnoughFields", "字段数不足，无法定位数据体"],
      };

      const FILE = {
        path: "/Users/gtouck/project/data-perf/testdata/sample-utf8.txt",
        sizeBytes: 268435456,
        lineCount: 1048576,
        indexMemoryBytes: 4194304,
      };

      // ── 模拟中的发送任务 ──────────────────────────────────
      let run = null;
      let logSeq = 0;
      const logs = [];
      const addLog = (level, text) =>
        logs.push({ seq: logSeq++, at: Date.now(), level, text });

      const bytesOf = (i) => {
        const s = SAMPLE[i % SAMPLE.length];
        return s.d.split(" ").map((h) => parseInt(h, 16));
      };

      function snapshot() {
        if (!run) return null;
        const secs = (Date.now() - run.startedAt) / 1000;
        if (run.state === "running") {
          run.sent = Math.min(9_999_999, Math.floor(secs * 12847));
        }
        const jitter = [];
        for (let i = 0; i < 200; i++) {
          // 大部分贴着基线，偶尔一根冒出来 —— 真实调度就是这样
          const spike = Math.random() < 0.06;
          jitter.push(
            run.intervalUs + (spike ? Math.random() * 60 : Math.random() * 6 - 3),
          );
        }
        return {
          state: run.state,
          sentFrames: run.sent,
          sentBytes: run.sent * 8,
          droppedBufferFull: Math.floor(run.sent / 90000),
          refused: 0,
          ioErrors: 0,
          oversize: 0,
          parsedFrames: run.sent + 3,
          skippedLines: 3,
          filteredOut: Math.floor(run.sent * 0.4),
          mutationIssues: 0,
          currentLine: run.sent % FILE.lineCount,
          loopsDone: 0,
          pending: 128,
          jitterP50Us: 3,
          jitterP99Us: 41,
          recentIntervals: jitter,
          targetDesc: run.desc,
          intervalUs: run.intervalUs,
        };
      }

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main", windowLabel: "main" },
        },
        transformCallback: (cb) => cb,
        invoke: async (cmd, args) => {
          switch (cmd) {
            // 无边框窗口按钮在预览中只验证可点击，不操作浏览器窗口
            case "plugin:window|close":
            case "plugin:window|minimize":
            case "plugin:window|toggle_maximize":
              return null;

            // 文件选择框是原生的，预览里直接返回样本路径
            case "plugin:dialog|open":
              return FILE.path;

            case "open_file":
              addLog("info", `已打开 ${FILE.path} · 1048576 行 · 索引占用 4096 KB`);
              return FILE;
            case "file_info":
              return FILE;
            case "close_file":
              return null;

            case "preview": {
              const { start, count, filter } = args;
              // 桩件里粗略模拟筛选：有启用规则时，[RX] 行算作被排除
              const filtering = (filter?.rules ?? []).some((r) => r.enabled);
              const rows = [];
              for (let i = 0; i < count && start + i < FILE.lineCount; i++) {
                const lineNo = start + i + 1;
                const s = SAMPLE[lineNo % SAMPLE.length];
                const err = ERRORS[lineNo % 1000];
                rows.push({
                  lineNo,
                  prefix: s.p,
                  data: err ? (err[0] === "emptyData" ? "" : "01 A5 3") : s.d,
                  trailing: s.t,
                  byteLen: err ? 0 : s.d.split(" ").length,
                  truncated: false,
                  filtered: filtering && !err && s.p.startsWith("[RX]"),
                  error: err ? err[0] : null,
                  errorMsg: err ? err[1] : null,
                });
              }
              return rows;
            }

            // 桩件里的样本数据前缀固定是「[TX] 000123 发送 」，直接给出对应答案
            case "guess_parse":
              return {
                config: {
                  ...args.config,
                  encoding: "utf8",
                  prefix: {
                    mode: "fields",
                    delimiter: { kind: "whitespace" },
                    collapse: true,
                    skipFields: 3,
                  },
                },
                summary: "已按文件内容推测：UTF-8，按空白丢弃行首 3 个字段",
              };

            case "network_interfaces":
              return [
                { name: "en0", ip: "192.168.1.42", isLoopback: false },
                { name: "en5", ip: "10.20.30.11", isLoopback: false },
                { name: "lo0", ip: "127.0.0.1", isLoopback: true },
              ];

            case "start_send": {
              const c = args.config;
              const t = c.target;
              run = {
                state: "running",
                sent: 0,
                startedAt: Date.now(),
                intervalUs: c.pacing.intervalUs || 78,
                spans: (c.mutate?.rules ?? []).some((r) => r.enabled),
                desc:
                  t.mode === "unicast"
                    ? `单播 → ${t.host}:${t.port}`
                    : `组播 → ${t.group}:${t.port}（网卡 ${t.interface ?? "系统默认"}，TTL ${t.ttl}）`,
              };
              addLog("info", `开始发送 · ${run.desc}`);
              addLog("info", "本地端口 0.0.0.0:54233");
              addLog(
                "info",
                `行范围 ${c.pacing.startLine} ~ ${c.pacing.endLine || FILE.lineCount}，间隔 ${c.pacing.intervalUs}μs`,
              );
              addLog(
                "warn",
                "内核发送缓冲已满，开始丢帧。可以调大发送缓冲或放宽发送间隔（后续同类不再单独记录）",
              );
              return null;
            }
            case "pause_send":
              if (run) run.state = "paused";
              return null;
            case "resume_send":
              if (run) run.state = "running";
              return null;
            case "step_send":
              if (run) run.sent += 1;
              return null;
            case "stop_send":
              if (run) addLog("info", `停止发送 · 共发出 ${run.sent} 帧`);
              run = null;
              return null;

            case "engine_status":
              return snapshot();

            case "recent_frames": {
              if (!run) return [];
              const n = Math.min(args.limit, 60);
              const out = [];
              for (let i = 0; i < n; i++) {
                const idx = run.sent - n + i;
                if (idx < 0) continue;
                const b = bytesOf(idx);
                // 模拟：头 2 字节是插入的，第 3 字节被替换，末 2 字节是校验和
                const framed = [0x5a, 0xa5, ...b, 0x1d, 0x0f];
                out.push({
                  lineNo: (idx % FILE.lineCount) + 1,
                  len: framed.length,
                  bytes: framed,
                  at: Date.now(),
                  spans: run.spans
                    ? [
                        { start: 0, len: 2, kind: "insert" },
                        { start: 2, len: 1, kind: "replace" },
                        { start: framed.length - 2, len: 2, kind: "computed" },
                      ]
                    : [],
                });
              }
              return out;
            }

            case "log_entries":
              return logs.filter((l) => l.seq >= args.after).slice(0, args.limit);

            case "error_groups":
              return [
                {
                  kind: "oddHexDigits",
                  message: "十六进制字符数为奇数",
                  count: 1204,
                  sampleLines: [11, 1011, 2011, 3011, 4011, 5011, 6011, 7011],
                },
                {
                  kind: "notEnoughFields",
                  message: "字段数不足，无法定位数据体",
                  count: 1048,
                  sampleLines: [41, 1041, 2041, 3041],
                },
              ];

            case "preflight_check": {
              const c = args.config;
              const out = [];
              if (c.pacing.intervalUs === 0)
                out.push({
                  severity: "warn",
                  area: "节奏控制",
                  message:
                    "间隔为 0 表示全速发送，实际速率取决于网卡和内核，很可能出现缓冲满丢帧",
                });
              const bad = (c.filter?.rules ?? []).some(
                (r) =>
                  r.enabled &&
                  r.condition.kind === "bytes" &&
                  /[^0-9a-fA-F\s:,-]/.test(r.condition.value),
              );
              if (bad)
                out.push({
                  severity: "error",
                  area: "筛选规则",
                  message: "第 1 条规则的字节值不是合法的十六进制",
                });
              const st2 = (c.mutate?.rules ?? []).filter(
                (r) => r.enabled && !["insert", "replace", "delete"].includes(r.op.kind),
              );
              const lastCk = st2.map((r) => r.op.kind).lastIndexOf("checksum");
              if (lastCk >= 0 && lastCk < st2.length - 1)
                out.push({
                  severity: "warn",
                  area: "修改规则",
                  message:
                    "校验和后面还有「长度」规则。它会改动已经算过校验的字节，把校验和移到最后才对",
                });
              return out;
            }

            case "app_dir":
              return "C:\\便携版示例目录";
            case "plugin:path|join":
              return args.paths.join("\\");
            case "save_profile":
              return null;
            case "load_profile":
              return { version: 1, name: "示例配置", config: args.__never };

            case "clear_log":
              logs.length = 0;
              return null;

            default:
              throw new Error("预览桩件未实现命令：" + cmd);
          }
        },
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
